name: Bug report
description: Something doesn't work, or the docs are wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting this. A short, concrete report is more useful than a long one.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Service (API, router, notifier, SLA)
        - Dashboard
        - Replay producer
        - docker-compose / Helm / observability
        - Docs
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands or requests, ideally starting from `docker compose up -d --build`.
      placeholder: |
        1. docker compose up -d --build
        2. curl -X POST ...
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Relevant lines from `docker compose logs <service>` or the browser console.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15 / Docker Desktop 4.x / commit abc1234
