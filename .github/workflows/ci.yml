name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service:
    name: Service (JUnit + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: service/target/surefire-reports

  dashboard:
    name: Dashboard (Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  replay:
    name: Replay producer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v test_replay
        working-directory: replay

  deploy-config:
    name: Helm lint and compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/routeiq
      - run: helm template ci deploy/helm/routeiq --set ingress.enabled=true --set serviceMonitor.enabled=true > /dev/null
      - run: docker compose config -q

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [service, dashboard]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t routeiq-service:ci service
      - run: docker build -t routeiq-dashboard:ci dashboard
