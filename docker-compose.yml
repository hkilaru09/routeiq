# Core stack:          docker compose up -d --build
# With observability:  docker compose --profile observability up -d --build
name: routeiq

x-service: &service
  build: ./service
  image: routeiq-service:local
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }
  mem_limit: 512m

x-env: &env
  DATABASE_URL: jdbc:postgresql://postgres:5432/routeiq
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  DATABASE_POOL_SIZE: "10"
  TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
  # Every process starts with all roles off; each service turns on its own.
  ROUTEIQ_OUTBOX_ENABLED: "false"
  ROUTEIQ_ROUTER_ENABLED: "false"
  ROUTEIQ_NOTIFIER_ENABLED: "false"
  ROUTEIQ_SLA_ENABLED: "false"
  ROUTEIQ_BOARD_ENABLED: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: routeiq
      POSTGRES_USER: routeiq
      POSTGRES_PASSWORD: routeiq
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeiq"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]

  webhook-sink:
    image: mendhak/http-https-echo:37
    environment:
      HTTP_PORT: "8080"
      LOG_IGNORE_PATH: /health

  # API: REST ingest, rule editor, WebSocket board, and the outbox relay.
  api:
    <<: *service
    environment:
      <<: *env
      ROUTEIQ_ROLE: api
      ROUTEIQ_OUTBOX_ENABLED: "true"
      ROUTEIQ_BOARD_ENABLED: "true"
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      retries: 30

  router:
    <<: *service
    environment:
      <<: *env
      ROUTEIQ_ROLE: router
      ROUTEIQ_ROUTER_ENABLED: "true"
      ROUTEIQ_OUTBOX_ENABLED: "true"

  notifier:
    <<: *service
    environment:
      <<: *env
      ROUTEIQ_ROLE: notifier
      ROUTEIQ_NOTIFIER_ENABLED: "true"

  sla:
    <<: *service
    environment:
      <<: *env
      ROUTEIQ_ROLE: sla
      ROUTEIQ_SLA_ENABLED: "true"
      ROUTEIQ_OUTBOX_ENABLED: "true"

  dashboard:
    build: ./dashboard
    image: routeiq-dashboard:local
    ports: ["3000:80"]
    depends_on:
      api: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes: [./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]

  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    profiles: [observability]
    ports: ["16686:16686"]

volumes:
  pgdata:
