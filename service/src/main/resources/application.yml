spring:
  application:
    name: routeiq
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/routeiq}
    username: ${DATABASE_USER:routeiq}
    password: ${DATABASE_PASSWORD:routeiq}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:1025}

routeiq:
  # Each process can run any subset of the roles; docker-compose and the Helm chart run one role per deployment.
  outbox:
    enabled: ${ROUTEIQ_OUTBOX_ENABLED:true}
  router:
    enabled: ${ROUTEIQ_ROUTER_ENABLED:true}
  notifier:
    enabled: ${ROUTEIQ_NOTIFIER_ENABLED:true}
  sla:
    enabled: ${ROUTEIQ_SLA_ENABLED:true}
    scan-interval-ms: ${ROUTEIQ_SLA_SCAN_INTERVAL_MS:15000}
  board:
    enabled: ${ROUTEIQ_BOARD_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: routeiq
      role: ${ROUTEIQ_ROLE:all}
    distribution:
      percentiles-histogram:
        routeiq.route.latency: true
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${TRACING_EXPORT_ENABLED:false}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
